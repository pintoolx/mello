name: Application safety checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mello_ci
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: mello_integration
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mello_ci -d mello_integration"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://mello_ci:local-ci-only@127.0.0.1:5432/mello_integration
      PAYMENT_MODE: mock
      CONTRACT_ANCHOR_MODE: mock
      AGENT_MODE: demo
      SERVICE_DISCOVERY_MODE: local_demo
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Fixtures only: never use a wallet, external seller, LLM key or real funds.
      - run: npm run test:integration --workspace @mello/api -- src/modules/service-registry/registry.integration.test.ts
      - run: npm run build
